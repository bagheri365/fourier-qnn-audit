[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-qnn-audit"
version = "0.0.1"
description = "Open-source tools for Fourier surrogate audits of trained quantum neural networks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<2",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
quantum = ["pennylane>=0.38", "torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fourier_qnn_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
